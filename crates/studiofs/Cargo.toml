[package]
name = "studiofs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "studiofs"
path = "src/main.rs"

[dependencies]
studiofs-meta.workspace = true
studiofs-data.workspace = true
studiofs-cache.workspace = true
studiofs-vfs.workspace = true

clap.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
opendal.workspace = true
thiserror.workspace = true
directories = "6"
serde_json.workspace = true
serde.workspace = true
toml = "1.0.7"
uuid.workspace = true
home.workspace = true
libc.workspace = true
bytes.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
prost = "0.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sysinfo.workspace = true
url.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
mimalloc.workspace = true
fs2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
studiofs-fuse.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
studiofs-macfuse.workspace = true
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSControl", "NSFont", "NSGraphics", "NSPanel", "NSScreen", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString"] }

[target.'cfg(unix)'.dependencies]
pyroscope = { version = "2", default-features = false, features = ["backend-jemalloc", "backend-pprof-rs"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tray-icon = "0.22.0"
winit = "0.30.12"

[target.'cfg(windows)'.dependencies]
studiofs-winfsp.workspace = true
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(windows)'.build-dependencies]
winfsp.workspace = true

[package.metadata.cargo-machete]
# cargo-machete does not model the Windows-only build.rs usage here.
ignored = ["winfsp"]

[dev-dependencies]
dotenvy.workspace = true
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }
