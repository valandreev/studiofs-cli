[package]
name = "studiofs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "studiofs"
path = "src/main.rs"

[dependencies]
studiofs-meta.workspace = true
studiofs-data.workspace = true
studiofs-cache.workspace = true
studiofs-vfs.workspace = true

clap.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
opendal.workspace = true
directories = "6"
serde_json.workspace = true
serde.workspace = true
serde_derive = "1"
toml = "1.0.7"
postcard.workspace = true
uuid.workspace = true
home.workspace = true
libc.workspace = true
bytes.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
prost = "0.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sysinfo.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
studiofs-fuse.workspace = true
pyroscope = { version = "2", default-features = false, features = ["backend-jemalloc", "backend-pprof-rs"] }

[target.'cfg(windows)'.dependencies]
studiofs-winfsp.workspace = true
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
winfsp.workspace = true

[dev-dependencies]
tempfile.workspace = true
dotenvy.workspace = true
