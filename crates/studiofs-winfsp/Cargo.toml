[package]
name = "studiofs-winfsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
studiofs-vfs.workspace = true
studiofs-meta.workspace = true
studiofs-cache.workspace = true
studiofs-data.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.12", features = ["windows-62", "notify"] }
winfsp-sys = "0.12"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { workspace = true }
