thiserror.workspace = true
uuid.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
syn = { version = "2", features = ["full"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
