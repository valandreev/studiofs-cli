on:
  cli:
    init:
      ref: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.3

tasks:
  - key: code
    call: git/clone 2.0.7
    with:
      repository: https://github.com/valandreev/studiofs-cli.git
      ref: ${{ init.ref }}
      github-token: ${{ github.token }}

  - key: rust
    call: rust-lang/install 1.0.7
    with:
      rust-version: 1.95.0

  - key: cargo-fetch
    use: [code, rust]
    filter:
      - Cargo.lock
      - Cargo.toml
      - crates/*/Cargo.toml
      - crates/*/src/lib.rs
      - crates/*/src/main.rs
      - crates/*/src/bin/*.rs
    run: cargo fetch --locked

  - key: simulation-fast
    use: [code, rust, cargo-fetch]
    run: |
      set -euo pipefail

      ARTIFACT_ROOT="target/simulation-counterexamples/fast"
      cargo run -p studiofs-scenario --bin studiofs-scenario -- run-corpus \
        --corpus fast \
        --artifact-root "${ARTIFACT_ROOT}"
    env:
      RUSTFLAGS: "-Dwarnings"
    outputs:
      artifacts:
        - key: simulation-counterexamples-fast
          path: target/simulation-counterexamples/fast

  - key: simulation-deep
    use: [code, rust, cargo-fetch]
    run: |
      set -euo pipefail

      ARTIFACT_ROOT="target/simulation-counterexamples/deep"
      cargo run -p studiofs-scenario --bin studiofs-scenario -- run-corpus \
        --corpus deep \
        --artifact-root "${ARTIFACT_ROOT}"
    env:
      RUSTFLAGS: "-Dwarnings"
    outputs:
      artifacts:
        - key: simulation-counterexamples-deep
          path: target/simulation-counterexamples/deep
