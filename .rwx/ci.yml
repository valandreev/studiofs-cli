on:
  cli:
    init:
      ref: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.3

tasks:
  - key: code
    call: git/clone 2.0.7
    with:
      repository: https://github.com/valandreev/studiofs-cli.git
      ref: ${{ init.ref }}
      github-token: ${{ github.token }}

  - key: rust
    call: rust-lang/install 1.0.7
    with:
      rust-version: 1.95.0

  - key: linux-packages
    run: |
      sudo apt-get update
      sudo apt-get install -y fuse3 libfuse3-dev libgtk-3-dev libxdo-dev
      sudo apt-get install -y libappindicator3-dev || sudo apt-get install -y libayatana-appindicator3-dev
      sudo apt-get clean

  - key: cargo-fmt
    use: [code, rust]
    run: cargo fmt --all -- --check

  - key: cargo-fetch
    use: [code, rust]
    filter:
      - Cargo.lock
      - Cargo.toml
      - crates/*/Cargo.toml
      - crates/*/src/lib.rs
      - crates/*/src/main.rs
    run: cargo fetch --locked

  - key: cargo-clippy
    use: [code, rust, linux-packages, cargo-fetch]
    run: cargo clippy --workspace --all-targets -- -D warnings
    env:
      RUSTFLAGS: "-Dwarnings"

  - key: cargo-clippy-all-features
    use: [code, rust, linux-packages, cargo-fetch]
    run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    env:
      RUSTFLAGS: "-Dwarnings"

  - key: cargo-doc
    use: [code, rust, linux-packages, cargo-fetch]
    run: cargo doc --workspace --no-deps
    env:
      RUSTFLAGS: "-Dwarnings"
      RUSTDOCFLAGS: "-Dwarnings"

  - key: cargo-audit-install
    use: rust
    run: cargo install --locked cargo-audit

  - key: cargo-audit
    use: [code, rust, cargo-audit-install]
    filter:
      - Cargo.lock
    run: |
      cargo audit --json --file ./Cargo.lock > cargo-audit.json || true
      python3 - <<'PY'
      import json
      import sys

      try:
          with open("cargo-audit.json", encoding="utf-8") as fh:
              report = json.load(fh)
      except Exception as exc:
          print("Failed to parse cargo-audit output:", exc)
          sys.exit(1)

      if report.get("vulnerabilities", {}).get("found", False):
          print("VULNERABILITIES FOUND")
          sys.exit(1)

      warnings = report.get("warnings", {}).get("unmaintained", [])
      if warnings:
          print("Unmaintained dependencies (non-fatal):")
          for warning in warnings:
              package = warning.get("package") or {}
              print("-", package.get("name"), package.get("version"))

      sys.exit(0)
      PY

  - key: quality
    use:
      - cargo-fmt
      - cargo-clippy
      - cargo-clippy-all-features
      - cargo-doc
      - cargo-audit
    run: echo "Quality gates passed"

  - key: cargo-test-linux-workspace
    use: [code, rust, linux-packages, cargo-fetch]
    run: cargo test --workspace --all-targets -- --nocapture
    env:
      RUSTFLAGS: "-Dwarnings"
    agent:
      cpus: 8

  - key: cargo-test-local-first-offline-vfs-fast
    use: [code, rust, linux-packages, cargo-fetch]
    run: |
      set -euo pipefail

      cargo test -p studiofs-vfs --test vfs_test upload_backlog_progresses_via_persisted_local_payload_reads -- --exact --nocapture
      cargo test -p studiofs-vfs --test vfs_test warm_cache_sequential_read_bounded_latency_after_write -- --exact --nocapture
      cargo test -p studiofs-vfs --test vfs_test mixed_workload_concurrent_readers_during_pending_upload_no_errors -- --exact --nocapture
      cargo test -p studiofs-vfs --test vfs_test handle_aware_read_policy_keeps_sequential_and_random_streams_separate -- --exact --nocapture
      cargo test -p studiofs-vfs --test vfs_test file_session_flush_ordering_is_deterministic -- --exact --nocapture
    env:
      RUSTFLAGS: "-Dwarnings"

  - key: cargo-test-postgresql
    use: [code, rust, linux-packages, cargo-fetch]
    docker: true
    run: |
      set -euo pipefail

      postgres_container=""
      cleanup_postgres() {
        if [[ -n "${postgres_container}" ]]; then
          docker rm --force "${postgres_container}" >/dev/null 2>&1 || true
        fi
      }
      trap cleanup_postgres EXIT
      trap 'exit 130' INT
      trap 'exit 143' TERM

      postgres_container="$(docker run --detach \
        --env POSTGRES_HOST_AUTH_METHOD=trust \
        --publish 127.0.0.1::5432 \
        --health-cmd 'grep -qx postgres /proc/1/comm && pg_isready -h 127.0.0.1 -U postgres -d postgres' \
        --health-interval 2s \
        --health-timeout 5s \
        --health-retries 30 \
        postgres:18-alpine)"

      postgres_status=""
      for attempt in $(seq 1 60); do
        postgres_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${postgres_container}")"
        case "${postgres_status}" in
          healthy)
            break
            ;;
          unhealthy|exited|dead)
            docker logs "${postgres_container}" >&2 || true
            echo "PostgreSQL service failed health check: ${postgres_status}" >&2
            exit 1
            ;;
        esac
        sleep 1
      done

      if [[ "${postgres_status}" != "healthy" ]]; then
        docker logs "${postgres_container}" >&2 || true
        echo "PostgreSQL service did not become healthy within 60 seconds" >&2
        exit 1
      fi

      postgres_port="$(docker port "${postgres_container}" 5432/tcp | awk -F: 'NR == 1 { print $NF }')"
      if [[ ! "${postgres_port}" =~ ^[0-9]+$ ]]; then
        echo "PostgreSQL service did not publish a usable host port" >&2
        exit 1
      fi

      export STUDIOFS_TEST_PG_DSN="host=127.0.0.1 port=${postgres_port} user=postgres dbname=postgres sslmode=disable"

      run_ignored_tests() {
        local label="$1"
        shift
        local test_list
        local test_count

        test_list="$(cargo test "$@" -- --ignored --list)"
        test_count="$(awk '/: test$/ { count += 1 } END { print count + 0 }' <<< "${test_list}")"
        if [[ "${test_count}" -eq 0 ]]; then
          echo "PostgreSQL test gate failed: ${label} matched zero ignored tests" >&2
          return 1
        fi

        echo "PostgreSQL test gate selected ${test_count} ignored tests: ${label}"
        cargo test "$@" -- --ignored --test-threads=1 --nocapture
      }

      run_ignored_tests "studiofs-meta pg_engine" -p studiofs-meta pg_engine::tests:: --lib
      run_ignored_tests "studiofs CLI" -p studiofs --bin studiofs cli::
    env:
      RUSTFLAGS: "-Dwarnings"

  - key: ubuntu-linux
    use:
      - quality
      - cargo-test-linux-workspace
      - cargo-test-local-first-offline-vfs-fast
      - cargo-test-postgresql
    run: echo "Ubuntu Linux checks passed"

  - key: rocky-linux
    call: ${{ run.dir }}/rocky.yml
    init:
      ref: ${{ init.ref }}

  - key: linux
    after:
      - ubuntu-linux
      - rocky-linux
    run: echo "Linux checks passed"
