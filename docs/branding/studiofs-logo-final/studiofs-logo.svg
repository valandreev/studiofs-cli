  />
  <g fill="currentColor">
    <circle cx="34" cy="36" r="3" />
    <circle cx="48" cy="36" r="3" />
    <circle cx="34" cy="50" r="3" />
    <circle cx="48" cy="50" r="3" />
    <circle cx="34" cy="64" r="3" />
    <circle cx="48" cy="64" r="3" />
    <circle cx="62" cy="64" r="3" />
    <rect x="58" y="32" width="12" height="24" rx="6" />
  </g>
</svg>
