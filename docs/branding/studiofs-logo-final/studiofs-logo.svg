<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">StudioFS logo</title>
  <desc id="desc">
    StudioFS Payload Cache logo with rounded volume frame, cache dots, and an
    asymmetric anchor dot below the hot payload object.
  </desc>
