# Zensical build for the uk user guide. Run from the repo root: docs/user-guide/build-site.sh
site_name: StudioFS
site_description: Посібник StudioFS
repo_url: https://github.com/valandreev/studiofs-cli
repo_name: valandreev/studiofs-cli
edit_uri: edit/main/docs/user-guide/uk/
docs_dir: uk
site_dir: .build/docs/uk

nav:
