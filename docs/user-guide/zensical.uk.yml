      - "02. Як це все працює?": 02-how-does-this-thing-work.md
      - "03. Можливості, обмеження та системні вимоги": 03-capabilities-limits-and-requirements.md
      - "04. StudioFS та альтернативи: що обрати?": 04-studiofs-vs-alternatives-which-tool-fits-your-workflow.md
  - "Підготовка інфраструктури":
      - "05. Обираємо конфігурацію": 05-choose-your-setup.md
      - "06. S3 — дім для наших файлів": 06-s3-a-home-for-your-files.md
      - "07. PostgreSQL — мозок, який пам’ятає, де лежать файли": 07-postgresql-the-brain-behind-the-files.md
      - "08. Tailscale — приватний шлях до PostgreSQL": 08-tailscale-netbird-a-private-path-to-postgresql.md
      - "09. Перевіряємо інфраструктуру": 09-check-your-infrastructure.md
  - "Встановлення StudioFS":
      - "10. Встановлюємо StudioFS на Windows": 10-install-studiofs-on-windows.md
      - "11. Встановлюємо StudioFS на macOS": 11-install-studiofs-on-macos.md
      - "12. Встановлюємо StudioFS на Linux": 12-install-studiofs-on-linux.md
  - "Перший хмарний диск":
      - "13. Створюємо перший том — studiofs init": 13-create-your-first-volume-studiofs-init.md
      - "14. Підключаємо том — studiofs mount": 14-mount-your-volume-studiofs-mount.md
      - "15. Перші файли у хмарі": 15-your-first-files-in-the-cloud.md
      - "16. Підключаємо другий комп’ютер — studiofs discover": 16-connect-a-second-computer-studiofs-discover.md
      - "17. Безпечне відключення — studiofs umount": 17-unplug-safely-studiofs-umount.md
  - "Щоденна робота":
      - "18. Для чого підходить StudioFS і де потрібна обережність": 18-studiofs-workloads.md
      - "19. Синхронізація, поганий Wi-Fi та інші несподіванки": 19-sync-bad-wi-fi-and-other-surprises.md
      - "20. Кеш: чому хмара використовує мій SSD?": 20-cache-why-is-the-cloud-using-my-ssd.md
      - "21. Двоє людей, один файл: співпраця та конфлікти": 21-two-people-one-file-collaboration-and-conflicts.md
      - "22. Налаштування, стан і активність": 22-settings-status-and-activity.md
  - "Безпека та обслуговування":
      - "23. Видалення файлів: чарівного кошика немає": 23-deleting-files-there-is-no-magic-trash-can.md
      - "24. Знімки: машина часу для вашого тому": 24-snapshots-a-time-machine-for-your-volume.md
