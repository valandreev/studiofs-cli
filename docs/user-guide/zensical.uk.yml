      - "26. Облікові дані, шифрування та доступ": 26-credentials-encryption-and-access.md
      - "27. Обслуговування та видалення тому": 27-maintenance-and-removing-a-volume.md
  - "Допомога та довідка":
      - "28. Усунення несправностей: коли кіт перестає муркотіти": 28-troubleshooting-when-the-cat-stops-purring.md
      - "29. Журнали, діагностика та звернення по допомогу": 29-logs-diagnostics-and-asking-for-help.md
      - "30. Глосарій, шпаргалка команд і поширені запитання": 30-glossary-command-cheat-sheet-and-faq.md

theme:
  name: material
  custom_dir: theme
  language: uk
  logo: assets/images/cat_logo.svg
  favicon: assets/images/cat_logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/stylesheets/brand.css

extra:
  alternate:
    - name: English
      link: /docs/en/
      lang: en
    - name: Українська
      link: /docs/uk/
      lang: uk
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/valandreev/studiofs-cli

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
