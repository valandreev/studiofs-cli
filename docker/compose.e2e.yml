name: studiofs-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: studiofs
      POSTGRES_PASSWORD: studiofs
      POSTGRES_DB: studiofs
    ports:
      - "${STUDIOFS_E2E_POSTGRES_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studiofs -d studiofs"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    labels:
      studiofs.e2e.run: "${STUDIOFS_E2E_RUN_ID:-manual}"
      studiofs.e2e.service: "postgres"
    volumes:
      - postgres-data:/var/lib/postgresql

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.94
    command: ["--address", ":9000", "--console-enable", "/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STUDIOFS_E2E_RUSTFS_PORT:-29000}:9000"
      - "${STUDIOFS_E2E_RUSTFS_CONSOLE_PORT:-29001}:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/health >/dev/null && curl -fsS http://localhost:9001/health >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    labels:
      studiofs.e2e.run: "${STUDIOFS_E2E_RUN_ID:-manual}"
      studiofs.e2e.service: "rustfs"
    volumes:
      - rustfs-data:/data

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "${STUDIOFS_E2E_TOXIPROXY_API_PORT:-28474}:8474"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    labels:
      studiofs.e2e.run: "${STUDIOFS_E2E_RUN_ID:-manual}"
      studiofs.e2e.service: "toxiproxy"

volumes:
  postgres-data:
  rustfs-data:
