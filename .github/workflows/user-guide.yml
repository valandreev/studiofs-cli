name: User guide site

on:
  pull_request:
    paths:
      - "docs/user-guide/**"
      - ".github/workflows/user-guide.yml"
  push:
    branches: [main]
    paths:
      - "docs/user-guide/**"
      - ".github/workflows/user-guide.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/user-guide/requirements.txt
      - run: docs/user-guide/build-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: user-guide-site
          path: site/docs
