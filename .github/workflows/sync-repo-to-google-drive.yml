name: Sync Wasabi repository snapshots

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasabi-repo-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Create repo snapshot info
        run: |
          cat > _REPO_SNAPSHOT_INFO.md <<EOF
          # Repository snapshot

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Commit URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          Synced at UTC: $(date -u +"%Y-%m-%d %H:%M:%S")
          EOF

      - name: Create repository archive
        id: archive
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/repo-cli-${{ github.sha }}.tar.gz
        run: |
          tar \
            --exclude=".git" \
            --exclude="target" \
            --exclude="node_modules" \
            --exclude="dist" \
            --exclude="build" \
            --exclude=".cache" \
            --exclude=".DS_Store" \
            -czf "$ARCHIVE_PATH" \
            -C "$GITHUB_WORKSPACE" .
          echo "path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload repository archive to Wasabi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
          WASABI_BUCKET: ${{ vars.WASABI_BUCKET }}
          RCLONE_CONFIG_WASABI_TYPE: s3
          RCLONE_CONFIG_WASABI_PROVIDER: Wasabi
          RCLONE_CONFIG_WASABI_ENV_AUTH: "true"
          RCLONE_CONFIG_WASABI_REGION: ${{ vars.WASABI_REGION }}
          RCLONE_CONFIG_WASABI_ENDPOINT: ${{ vars.WASABI_ENDPOINT }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set repository secret WASABI_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Set repository secret WASABI_SECRET_ACCESS_KEY}"
          : "${WASABI_BUCKET:?Set repository variable WASABI_BUCKET}"
          : "${RCLONE_CONFIG_WASABI_REGION:?Set repository variable WASABI_REGION}"
          : "${RCLONE_CONFIG_WASABI_ENDPOINT:?Set repository variable WASABI_ENDPOINT}"
          rclone copyto "$ARCHIVE_PATH" \
            "wasabi:${WASABI_BUCKET}/repo-cli/${GITHUB_SHA}.tar.gz" \
            --progress

