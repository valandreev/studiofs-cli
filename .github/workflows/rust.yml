name: Rust CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  RUSTFLAGS: "-Dwarnings"

# ─── Jobs ──────────────────────────────────────────────────────────────
#
#  quality   — portable lint, fmt, doc, audit (runs once on Linux)
#  linux     — workspace tests on Linux
#  macos     — clippy + tests on macOS  (validates studiofs-fuse macOS paths)
#  windows   — clippy + tests on Windows (validates studiofs-winfsp)
#
# Platform verification jobs depend on quality so a fmt / clippy / audit
# failure short-circuits before consuming macOS / Windows runner minutes.

jobs:
  # ─── Quality / Portable Checks ────────────────────────────────────
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Linux Verification ────────────────────────────────────────────
  linux:
    name: Linux
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-targets -- --nocapture

      - name: cargo test (SFS-121 offline fast suite)
        # Explicit gate for the SFS-121 buffered-first offline tests.
        # These are already included in the workspace run above; this step
        # makes failures immediately attributable to the SFS-121 suite in CI.
        run: cargo test -p studiofs-vfs --test vfs_test sfs121_ -- --nocapture

  # ─── macOS Verification ────────────────────────────────────────────
  macos:
    name: macOS
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install macFUSE
        run: brew install --cask macfuse

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets -- --nocapture

  # ─── Windows Verification ──────────────────────────────────────────
  windows:
    name: Windows
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install WinFSP
        run: choco install winfsp -y

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets -- --nocapture
