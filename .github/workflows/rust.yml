name: Rust CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  # Enable additional lints for better code quality
  RUSTFLAGS: "-Dwarnings"

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets -- --nocapture

      - name: cargo test (SFS-121 offline fast suite)
        # Explicit gate for the SFS-121 buffered-first offline tests.
        # These are already included in the workspace run above; this step
        # makes failures immediately attributable to the SFS-121 suite in CI.
        run: cargo test -p studiofs-vfs --test vfs_test sfs121_ -- --nocapture

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
