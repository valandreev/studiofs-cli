name: Linux CI

# Ubuntu quality gates, Ubuntu workspace/service-backed tests, and Rocky Linux
# workspace tests. License policy runs in license-compliance.yml; mounted E2E
# runs manually in linux-e2e.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-Dwarnings"
  RUST_TOOLCHAIN: "1.95.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.1
      - name: cargo audit
        run: |
          cargo audit --json --file ./Cargo.lock > cargo-audit.json || true
          python3 - <<'PY'
          import json
          import sys

          try:
              with open("cargo-audit.json", encoding="utf-8") as fh:
                  report = json.load(fh)
          except Exception as exc:
              print("Failed to parse cargo-audit output:", exc)
              sys.exit(1)

          vulnerabilities = report.get("vulnerabilities", {})
          if vulnerabilities.get("found", False):
              print("VULNERABILITIES FOUND")
              for vulnerability in vulnerabilities.get("list", []):
                  package = vulnerability.get("package") or {}
                  advisory = vulnerability.get("advisory") or {}
                  print("-", advisory.get("id"), package.get("name"), package.get("version"))
              sys.exit(1)

          for kind, warnings in sorted(report.get("warnings", {}).items()):
              if warnings:
                  print(f"{kind.capitalize()} dependencies (non-fatal):")
                  for warning in warnings:
                      package = warning.get("package") or {}
                      advisory = (warning.get("advisory") or {}).get("id", "")
                      print("-", package.get("name"), package.get("version"), advisory)

          sys.exit(0)
          PY

  ubuntu-tests:
    name: Ubuntu workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon fuse3 libfuse3-dev python3-dbus python3-gi
      - name: cargo test (workspace)
        run: cargo test --workspace --all-targets -- --nocapture
      - name: Linux tray backend lifecycle
        run: |
          set -euo pipefail
          cargo test --locked -p studiofs --bin studiofs --no-run --message-format=json > target/tray-test-artifacts.json
          timeout 20s dbus-run-session -- cargo test --locked -p studiofs --bin studiofs \
            tray::supported::tests::linux_backend_updates_and_stops_without_a_watcher \
            -- --exact --ignored --nocapture
          timeout 20s env DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent/studiofs-sfs-884 \
            cargo test --locked -p studiofs --bin studiofs \
            tray::supported::tests::linux_backend_returns_error_without_a_session_bus \
            -- --exact --ignored --nocapture
          cargo build --locked -p studiofs
          timeout 30s dbus-run-session -- /usr/bin/python3 tools/test-linux-tray.py target/debug/studiofs target/tray-test-artifacts.json
      - name: Local-first offline VFS fast checks
        run: |
          set -euo pipefail

          cargo test -p studiofs-vfs --test vfs_test upload_backlog_progresses_via_persisted_local_payload_reads -- --exact --nocapture
          cargo test -p studiofs-vfs --test vfs_test warm_cache_sequential_read_bounded_latency_after_write -- --exact --nocapture
          cargo test -p studiofs-vfs --test vfs_test mixed_workload_concurrent_readers_during_pending_upload_no_errors -- --exact --nocapture
          cargo test -p studiofs-vfs --test vfs_test handle_aware_read_policy_keeps_sequential_and_random_streams_separate -- --exact --nocapture
          cargo test -p studiofs-vfs --test vfs_test file_session_flush_ordering_is_deterministic -- --exact --nocapture

          # A doctest filter that matches nothing exits successfully, so pin the count.
          lock_order_doctests="$(cargo test -p studiofs-vfs --doc lock_order -- --list)"
          lock_order_doctest_count="$(awk '/: test$/ { count += 1 } END { print count + 0 }' <<< "${lock_order_doctests}")"
          if [[ "${lock_order_doctest_count}" -ne 3 ]]; then
            echo "Lock-order doctest gate failed: expected 3 doctests, found ${lock_order_doctest_count}" >&2
            exit 1
          fi
          cargo test -p studiofs-vfs --doc lock_order

  s3-and-postgresql:
    name: S3 and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Disposable CI-only RustFS credentials; command output passes these by name only.
      RUSTFS_ACCESS_KEY: studiofs
      RUSTFS_SECRET_KEY: studiofs123
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev
      - name: Service-backed ignored tests
        run: |
          set -euo pipefail

          postgres_container=""
          rustfs_container=""
          cleanup_services() {
            for container in "${postgres_container}" "${rustfs_container}"; do
              if [[ -n "${container}" ]]; then
                docker rm --force -v "${container}" >/dev/null 2>&1 || true
              fi
            done
          }
          trap cleanup_services EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          wait_for_healthy_service() {
            local container="$1"
            local service="$2"
            local status=""
            for attempt in $(seq 1 90); do
              if ! status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${container}" 2>/dev/null)"; then
                status="inspect_failed"
              fi
              case "${status}" in
                healthy)
                  return 0
                  ;;
                unhealthy|exited|dead)
                  docker logs "${container}" >&2 || true
                  echo "${service} service failed health check: ${status}" >&2
                  return 1
                  ;;
              esac
              sleep 1
            done

            docker logs "${container}" >&2 || true
            echo "${service} service did not become healthy within 90 seconds (last status: ${status})" >&2
            return 1
          }

          postgres_container="$(docker run --detach \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1::5432 \
            --health-cmd 'grep -qx postgres /proc/1/comm && pg_isready -h 127.0.0.1 -U postgres -d postgres' \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            postgres:18-alpine)"

          rustfs_container="$(docker run --detach \
            --env RUSTFS_ACCESS_KEY \
            --env RUSTFS_SECRET_KEY \
            --env RUSTFS_ADDRESS=:9000 \
            --env RUSTFS_CONSOLE_ENABLE=true \
            --publish 127.0.0.1::9000 \
            --health-cmd 'curl -fsS http://localhost:9000/health >/dev/null && curl -fsS http://localhost:9001/health >/dev/null' \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            --health-start-period 10s \
            rustfs/rustfs:1.0.0-alpha.94 \
            --address :9000 --console-enable /data)"

          wait_for_healthy_service "${postgres_container}" "PostgreSQL"
          wait_for_healthy_service "${rustfs_container}" "RustFS"

          postgres_port="$(docker port "${postgres_container}" 5432/tcp | awk -F: 'NR == 1 { print $NF }')"
          if [[ ! "${postgres_port}" =~ ^[0-9]+$ ]]; then
            echo "PostgreSQL service did not publish a usable host port" >&2
            exit 1
          fi

          rustfs_port="$(docker port "${rustfs_container}" 9000/tcp | awk -F: 'NR == 1 { print $NF }')"
          if [[ ! "${rustfs_port}" =~ ^[0-9]+$ ]]; then
            echo "RustFS service did not publish a usable host port" >&2
            exit 1
          fi

          export STUDIOFS_TEST_PG_DSN="host=127.0.0.1 port=${postgres_port} user=postgres dbname=postgres sslmode=disable"
          export STUDIOFS_S3_ENDPOINT="http://127.0.0.1:${rustfs_port}"
          export STUDIOFS_S3_BUCKET="studiofs-test"
          export STUDIOFS_S3_ACCESS_KEY="${RUSTFS_ACCESS_KEY}"
          export STUDIOFS_S3_SECRET_KEY="${RUSTFS_SECRET_KEY}"
          export STUDIOFS_S3_REGION="us-east-1"
          export STUDIOFS_TEST_ONLINE_S3_ENDPOINT="${STUDIOFS_S3_ENDPOINT}"
          export STUDIOFS_TEST_ONLINE_S3_BUCKET="${STUDIOFS_S3_BUCKET}"
          export STUDIOFS_TEST_ONLINE_S3_ACCESS_KEY="${STUDIOFS_S3_ACCESS_KEY}"
          export STUDIOFS_TEST_ONLINE_S3_SECRET_KEY="${STUDIOFS_S3_SECRET_KEY}"

          run_ignored_tests() {
            local label="$1"
            local skip_filter="$2"
            local exact_match="$3"
            shift 3
            local -a list_args=(--ignored --list)
            local -a run_args=(--ignored --test-threads=1 --nocapture)
            if [[ -n "${skip_filter}" ]]; then
              list_args+=(--skip "${skip_filter}")
              run_args+=(--skip "${skip_filter}")
            fi
            if [[ "${exact_match}" == "true" ]]; then
              list_args+=(--exact)
              run_args+=(--exact)
            fi
            local test_list
            local test_count

            test_list="$(cargo test "$@" -- "${list_args[@]}")"
            test_count="$(awk '/: test$/ { count += 1 } END { print count + 0 }' <<< "${test_list}")"
            if [[ "${test_count}" -eq 0 ]]; then
              echo "Service-backed test gate failed: ${label} matched zero ignored tests" >&2
              return 1
            fi

            echo "Service-backed test gate selected ${test_count} ignored tests: ${label}"
            cargo test "$@" -- "${run_args[@]}"
          }

          run_ignored_tests "studiofs-meta pg_engine" checkpoint_scalability false -p studiofs-meta pg_engine::tests:: --lib
          run_ignored_tests "studiofs CLI" "" false -p studiofs --bin studiofs cli::

          run_ignored_tests "studiofs-data S3 put/get object" "" true -p studiofs-data --test integration_test put_and_get_object
          run_ignored_tests "studiofs-data S3 put/get by key" "" true -p studiofs-data --test integration_test put_and_get_by_key
          run_ignored_tests "studiofs-data S3 object lifecycle" "" true -p studiofs-data --test integration_test object_exists_lifecycle
          run_ignored_tests "studiofs-data S3 delete idempotency" "" true -p studiofs-data --test integration_test delete_object_idempotent
          run_ignored_tests "studiofs-data S3 multi-object write" "" true -p studiofs-data --test integration_test large_multi_object_write
          run_ignored_tests "studiofs-vfs published cold-read payload" "" true -p studiofs-vfs --test vfs_test committed_random_unaligned_reads_match_payload_after_publish_and_cold_reopen
          run_ignored_tests "studiofs-vfs partial-overwrite publication" "" true -p studiofs-vfs --test vfs_test large_file_partial_overwrite_reuploads_only_touched_extents

          run_ignored_tests "studiofs destroy S3 + PostgreSQL" "" true -p studiofs --test destroy_test destroy_fails_cleanly_with_incorrect_s3_permissions
          run_ignored_tests "studiofs destroy local-only S3 + PostgreSQL" "" true -p studiofs --test destroy_test destroy_local_only_removes_local_state_and_keeps_remote
          run_ignored_tests "studiofs destroy full S3 + PostgreSQL" "" true -p studiofs --test destroy_test destroy_full_removes_local_s3_and_postgres_state
          run_ignored_tests "studiofs dump/load S3 + PostgreSQL" "" true -p studiofs --test dump_load_test dump_load_restores_volume_and_discovery_reads_data
          run_ignored_tests "studiofs dump/load snapshot-v2 S3 + PostgreSQL" "" true -p studiofs --test dump_load_test dump_load_rejects_target_with_snapshot_v2_without_breaking_other_volumes
          run_ignored_tests "studiofs dump/load reachability replacement S3 + PostgreSQL" "" true -p studiofs --test dump_load_test dump_load_rejects_replacing_uuid_with_reachability_or_upload_state
          run_ignored_tests "studiofs dump/load new-server bystander accounting S3 + PostgreSQL" "" true -p studiofs --test dump_load_test dump_load_into_new_metadata_server_ignores_other_volume_accounting
          run_ignored_tests "studiofs dump/load concurrent accounting writer S3 + PostgreSQL" "" true -p studiofs --test dump_load_test dump_load_rejects_accounting_row_committed_while_load_waits

  rocky-tests:
    name: Rocky Linux workspace tests
    runs-on: ubuntu-24.04
    container:
      image: rockylinux:9
      # Reap orphaned zombies; the default PID 1 does not, which breaks process-group kill tests.
      options: --init
    timeout-minutes: 60
    steps:
      - name: Install Rocky packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb || true
          dnf -y install --allowerasing \
            ca-certificates \
            curl \
            gcc \
            gcc-c++ \
            git \
            fuse3 \
            fuse3-devel \
            make \
            openssl-devel \
            pkgconf-pkg-config
          dnf clean all
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo test (workspace)
        run: cargo test --workspace --all-targets -- --nocapture
