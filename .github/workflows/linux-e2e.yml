name: Linux mounted E2E

# Real libfuse3 mounts against Docker Compose infrastructure. Manual-only:
# the full run takes up to 30 minutes.

on:
  # TEMP: validate the full run on this branch; remove before merge.
  push:
    branches: [ci/linux-github-actions]
  workflow_dispatch:
    inputs:
      target:
        description: "smoke runs basic-multi-client-smoke; full runs every registered scenario"
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  RUST_BACKTRACE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    name: Mounted E2E (${{ inputs.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl fuse3 jq libfuse3-dev pkg-config python3

      - name: Preflight
        run: |
          set -euo pipefail
          docker version
          docker compose version
          test -c /dev/fuse || {
            echo "preflight failed: runner does not expose /dev/fuse" >&2
            exit 1
          }
          command -v fusermount3
          pkg-config --modversion fuse3
          cargo run -p studiofs-e2e -- list
          cargo test -p studiofs-e2e --test runner_contract -- --nocapture

      - name: Build studiofs
        run: cargo build -p studiofs --locked

      - name: Run mounted E2E
        env:
          E2E_TARGET: ${{ inputs.target || 'full' }}
        run: |
          set -euo pipefail
          RUN_ID="gha-${E2E_TARGET}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUN_ROOT="target/e2e-runs"

          scenarios=(basic-multi-client-smoke)
          if [[ "${E2E_TARGET}" == "full" ]]; then
            # Selection coverage is pinned by runner_contract::full_e2e_selects_every_registered_scenario.
            scenarios=(
              --scenario 1-28
              --scenario mounted-sync-safety-two-client-acceptance
              --scenario mounted-random-write-packing
            )
          fi

          echo "run_id=${RUN_ID}"
          set +e
          cargo run -p studiofs-e2e -- run "${scenarios[@]}" \
            --studiofs-bin target/debug/studiofs \
            --root "${RUN_ROOT}" \
            --run-id "${RUN_ID}" \
            --platform linux-fuse \
            --infra compose \
            --retain always
          STATUS=$?
          set -e

          python3 .github/scripts/summarize-e2e-report.py "${RUN_ROOT}/${RUN_ID}" "${STATUS}"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ inputs.target }}-runs
          path: target/e2e-runs/
          if-no-files-found: warn
