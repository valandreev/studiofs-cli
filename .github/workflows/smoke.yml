name: Backend Smoke Tests

# ─── Triggers ──────────────────────────────────────────────────────────
#
#  Manual dispatch:       always runs all platforms
#
#  Smoke tests validate real mount/unmount + file I/O through the
#  platform backends (Linux FUSE, macFUSE, WinFSP). They are separate
#  from the main rust.yml pipeline because they require kernel drivers
#  and may be flaky on hosted runners. This workflow is intentionally
#  manual-only.
#
#  See docs/smoke-test-strategy.md for the full strategy rationale.

on:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-Dwarnings"
  STUDIOFS_RUN_PLATFORM_BRIDGE_MOUNT_TESTS: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─── Linux FUSE ────────────────────────────────────────────────────
  linux-fuse:
    name: Linux FUSE Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify /dev/fuse availability
        run: |
          if [ ! -e /dev/fuse ]; then
            echo "::error::/dev/fuse not available on this runner"
            exit 1
          fi
          echo "/dev/fuse is available"
          ls -la /dev/fuse

      - name: Build FUSE smoke tests
        run: cargo test -p studiofs-fuse --test mount_sanity --no-run

      - name: Run FUSE smoke tests
        run: cargo test -p studiofs-fuse --test mount_sanity -- --ignored --nocapture --test-threads=1
        timeout-minutes: 5

      - name: Capture test output on failure
        if: failure()
        run: |
          echo '### FUSE Smoke Test Failure' >> $GITHUB_STEP_SUMMARY
          echo 'Test output is available in the "Run FUSE smoke tests" step log above.' >> $GITHUB_STEP_SUMMARY
          echo 'stdout/stderr from `--nocapture` is captured by GitHub Actions natively.' >> $GITHUB_STEP_SUMMARY

  # ─── macOS macFUSE ─────────────────────────────────────────────────
  #
  # continue-on-error: macFUSE system extension may not be loadable on
  # hosted runners. This job provides best-effort signal; reliable
  # coverage requires a self-hosted runner. See docs/smoke-test-strategy.md.
  macos-macfuse:
    name: macOS macFUSE Smoke
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install macFUSE
        run: brew install --cask macfuse

      - name: Check macFUSE status
        id: macfuse-check
        run: |
          if [ -d "/Library/Filesystems/macfuse.fs" ]; then
            echo "macFUSE filesystem bundle is installed"
          else
            echo "::warning::macFUSE filesystem bundle not found"
          fi
          # On macOS 11+ the kext may not be loaded without a reboot.
          # Log the state for debugging.
          if kextstat 2>/dev/null | grep -qi fuse; then
            echo "macFUSE kext appears to be loaded"
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macFUSE kext does not appear to be loaded — mount may fail"
            echo "loaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macFUSE native bridge smoke tests
        run: cargo test -p studiofs-macfuse --lib --no-run

      - name: Run macFUSE native bridge smoke tests
        run: cargo test -p studiofs-macfuse --lib -- --nocapture
        timeout-minutes: 5

      - name: Build legacy macOS FUSE compatibility smoke tests
        run: cargo test -p studiofs-fuse --test mount_sanity --no-run

      - name: Run legacy macOS FUSE compatibility logic smoke
        run: cargo test -p studiofs-fuse --test virtual_mount_test -- --nocapture
        timeout-minutes: 5

      - name: Run optional legacy Kernel FUSE smoke tests
        if: steps.macfuse-check.outputs.loaded == 'true'
        run: |
          echo "Kernel extension loaded. Running legacy system-level FUSE smoke test."
          cargo test -p studiofs-fuse --test mount_sanity -- --ignored --nocapture --test-threads=1
        timeout-minutes: 5

      - name: Report macOS Kernel Limitation
        if: steps.macfuse-check.outputs.loaded == 'false'
        run: |
          echo "### macOS macFUSE CI Notice" >> $GITHUB_STEP_SUMMARY
          echo "Standard GitHub-hosted macOS runners do not support third-party kernel extensions (KEXTs)." >> $GITHUB_STEP_SUMMARY
          echo "The **macFUSE native bridge smoke tests** and legacy compatibility logic smoke were executed instead." >> $GITHUB_STEP_SUMMARY
          echo "System-level mount tests are recommended for local or self-hosted environments." >> $GITHUB_STEP_SUMMARY

      - name: Capture test output on failure
        if: failure() && steps.macfuse-check.outputs.loaded == 'true'
        run: |
          echo '### macOS macFUSE Smoke Test Failure' >> $GITHUB_STEP_SUMMARY
          echo 'Test output is available in the macOS smoke step logs above.' >> $GITHUB_STEP_SUMMARY
          echo 'stdout/stderr from `--nocapture` is captured by GitHub Actions natively.' >> $GITHUB_STEP_SUMMARY

  # ─── Windows WinFSP ───────────────────────────────────────────────
  windows-winfsp:
    name: Windows WinFSP Smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install WinFSP
        run: choco install winfsp -y

      - name: Verify WinFSP installation
        shell: pwsh
        run: |
          $bin = "C:\Program Files (x86)\WinFsp\bin"
          $dll = "$bin\winfsp-x64.dll"
          if (Test-Path $dll) {
            Write-Output "WinFSP DLL found: $dll"
            Write-Output "$bin" >> $env:GITHUB_PATH
          } else {
            Write-Error "WinFSP DLL not found at expected path"
            exit 1
          }

      - name: Build WinFSP smoke tests
        run: cargo test -p studiofs-winfsp --test mount_sanity --no-run

      - name: Run WinFSP smoke tests
        run: cargo test -p studiofs-winfsp --test mount_sanity -- --ignored --nocapture --test-threads=1
        timeout-minutes: 5
        env:
          # Hosted Windows runners are noisy and may run on slower ephemeral storage.
          # Keep this as a path-health smoke floor; use self-hosted hardware for
          # performance validation.
          STUDIOFS_WINFSP_AJA_MIN_THROUGHPUT_MIB_PER_SEC: "16"
          STUDIOFS_WINFSP_TEST_MOUNT_POINT: "Z:"

      - name: Capture test output on failure
        if: failure()
        shell: pwsh
        run: |
          "### Windows WinFSP Smoke Test Failure" >> $env:GITHUB_STEP_SUMMARY
          "Test output is available in the 'Run WinFSP smoke tests' step log above." >> $env:GITHUB_STEP_SUMMARY
          "stdout/stderr from ``--nocapture`` is captured by GitHub Actions natively." >> $env:GITHUB_STEP_SUMMARY
