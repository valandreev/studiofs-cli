[workspace]
members = [
    "crates/studiofs",
    "crates/studiofs-meta",
    "crates/studiofs-data",
    "crates/studiofs-cache",
    "crates/studiofs-vfs",
    "crates/studiofs-fuse",
    "crates/studiofs-winfsp",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/valandreev/studiofs-cli"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
postgres-types = "0.2"

# Storage
opendal = { version = "0.55", features = ["services-s3"] }

# Metadata
redb = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Bytes
bytes = "1"

# Cache
lru = "0.16"

# Error handling
thiserror = "2"
anyhow = "1"

# Platform - FUSE (Linux/macOS)
# Linux can use fuser's pure-Rust /dev/fuse transport, which avoids linking
# libfuse3 and the "library too old" warning emitted by the C library on some
# newer distros. macOS still requires libfuse via macFUSE/osxfuse.
fuser = "0.16"
libc = "0.2"

# Platform - WinFSP (Windows)
winfsp = "0.12"

# Utils
parking_lot = "0.12"
dashmap = "6"
uuid = { version = "1", features = ["v4", "v5"] }
tempfile = "3"
home = "0.5"
dotenvy = "0.15"
url = "2"
unicode-normalization = "0.1"
sysinfo = "0.37"

# Internal crates
studiofs-meta = { path = "crates/studiofs-meta" }
studiofs-data = { path = "crates/studiofs-data" }
studiofs-cache = { path = "crates/studiofs-cache" }
studiofs-vfs = { path = "crates/studiofs-vfs" }
studiofs-fuse = { path = "crates/studiofs-fuse" }
studiofs-winfsp = { path = "crates/studiofs-winfsp" }
