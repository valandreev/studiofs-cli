[workspace]
members = [
    "crates/studiofs",
    "crates/studiofs-meta",
    "crates/studiofs-data",
    "crates/studiofs-cache",
    "crates/studiofs-vfs",
    "crates/studiofs-bridge",
    "crates/studiofs-fuse",
    "crates/studiofs-macfuse",
    "crates/studiofs-winfsp",
    "crates/studiofs-e2e",
    "crates/studiofs-scenario",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0"
repository = "https://github.com/valandreev/studiofs-cli"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs", "io-util", "net", "signal"] }
tokio-util = "0.7"
futures = "0.3"
tokio-postgres = "0.7"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"

# Storage
opendal = { version = "0.55", features = ["services-memory", "services-s3"] }

# Metadata
redb = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
serde-saphyr = "0.0.27"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Bytes
bytes = "1"

# Cache
lru = "0.16"

# Error handling
thiserror = "2"
anyhow = "1"

# Platform - FUSE (Linux/macOS)
# Linux can use fuser's pure-Rust /dev/fuse transport, which avoids linking
# libfuse3 and the "library too old" warning emitted by the C library on some
# newer distros. macOS still requires libfuse via macFUSE/osxfuse.
fuser = "0.16"
libc = "0.2"

# Platform - WinFSP (Windows)
winfsp = "0.12"

# Utils
parking_lot = "0.12"
dashmap = "6"
mimalloc = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
tempfile = "3"
home = "0.5"
dotenvy = "0.15"
url = "2"
unicode-normalization = "0.1"
sysinfo = "0.37"
smallvec = "1"
rand = { version = "0.9", features = ["os_rng"] }
zeroize = { version = "1", features = ["derive"] }

# Internal crates
studiofs-meta = { path = "crates/studiofs-meta" }
studiofs-data = { path = "crates/studiofs-data" }
studiofs-cache = { path = "crates/studiofs-cache" }
studiofs-vfs = { path = "crates/studiofs-vfs" }
studiofs-bridge = { path = "crates/studiofs-bridge" }
studiofs-fuse = { path = "crates/studiofs-fuse" }
studiofs-macfuse = { path = "crates/studiofs-macfuse" }
studiofs-winfsp = { path = "crates/studiofs-winfsp" }
studiofs-e2e = { path = "crates/studiofs-e2e" }
studiofs-scenario = { path = "crates/studiofs-scenario" }
